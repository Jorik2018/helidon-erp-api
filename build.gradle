plugins {
    id 'java'
    id 'application'
}

group = 'org.isobit'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    helidonVersion = '27.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

application {
    mainClass = 'org.isobit.erp.Main'
}

dependencies {
    // BOM de Helidon: mantiene todas las dependencias Helidon
    // usando versiones compatibles entre sí.
    implementation enforcedPlatform(
        "io.helidon:helidon-dependencies:${helidonVersion}"
    )

    implementation 'io.helidon.webserver:helidon-webserver'
    implementation 'io.helidon.config:helidon-config-yaml'

    implementation 'io.helidon.webserver.observe:helidon-webserver-observe-health'
    implementation 'io.helidon.health:helidon-health-checks'

    implementation 'jakarta.json:jakarta.json-api'
    implementation 'io.helidon.http.media:helidon-http-media-jsonp'

    runtimeOnly 'io.helidon.logging:helidon-logging-jul'

    implementation 'io.helidon.webserver.observe:helidon-webserver-observe-metrics'
    runtimeOnly 'io.helidon.metrics:helidon-metrics-system-meters'

    implementation 'io.helidon.dbclient:helidon-dbclient-mongodb'

    implementation 'io.helidon.common:helidon-common'
    implementation 'io.helidon.common:helidon-common-mapper'

    implementation 'io.helidon.dbclient:helidon-dbclient-health'
    implementation 'io.helidon.dbclient:helidon-dbclient-jsonp'
    implementation 'io.helidon.dbclient:helidon-dbclient'
    implementation 'io.helidon.dbclient:helidon-dbclient-metrics'

    implementation 'io.helidon.http.media:helidon-http-media-jsonb'

    implementation 'org.slf4j:slf4j-jdk14'

    // Solo tests



    //testImplementation 'io.helidon.webclient:helidon-webclient'

    //testImplementation 'org.junit.jupiter:junit-jupiter-api'
    //testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'






    
    testImplementation platform('org.junit:junit-bom:6.0.1')

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.hamcrest:hamcrest-all'

    testImplementation 'io.helidon.webserver.testing.junit5:helidon-webserver-testing-junit5'

    testImplementation 'io.helidon.dbclient:helidon-dbclient-jdbc'
    testImplementation 'io.helidon.dbclient:helidon-dbclient-hikari'
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass.get()
        )
    }
}